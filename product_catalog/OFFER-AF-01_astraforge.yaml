schema_version: "0.2"
offer:
  offer_id: OFFER-AF-01
  name: Astraforge
  profile_version: "2026-09-14.v0.3"
  owner: null
  status: sourced
  category: governed-agent-execution-runtime
  canonical_site: "https://astraforge.dev/"
  site_domain_note: >
    astraforge.ai is a duplicate/incorrect domain for this product; the
    canonical site is astraforge.dev (owner-confirmed 2026-09-14).
  positioning:
    category_statement: >
      Governed AI execution runtime — the layer that authorizes, isolates,
      coordinates, observes, and proves what an autonomous agent is allowed
      to do in a real system, as opposed to a chatbot, copilot, or
      orchestration framework. (source: AF-SRC-005, vendor_claim)
    one_liner: >
      Transform agents that can reason into workers that can act durably on
      real processes, under enterprise control.
    contre_positioning: >
      "Models decide. Agents work. Astraforge governs the execution."
      (owner_analysis_note, inference — this is the analyst's framing, not a
      verbatim vendor tagline)
    commercial_entry_point: DevFactory / software engineering (explicit "first wedge" per AF-SRC-005)
  problem:
    canonical: AI usage is already present, but delivery bottlenecks remain collective and cannot be solved by isolated copilots alone.
    anti_problem:
      - Need is only a general chatbot or individual coding assistant
      - Simple deterministic automation is already covered by workflow tooling
      - No measurable workflow bottleneck
      - No owner, access path, or baseline
  outcomes:
    primary: [cycle_time_reduction, throughput_improvement, quality_or_rework_improvement]
    secondary: [documentation_freshness, remediation_acceleration, reusable_agentic_assets, traceability_and_control]
  icp:
    maturity:
      must_have:
        - Existing or recent use of AI copilots or agents
        - Instrumentable engineering or operational workflow
      positive_signals:
        - Roadmap under delivery pressure
        - Backlog or recurring quality and remediation bottleneck
        - API-accessible SDLC or tooling
        - Platform or engineering owner
        - Need to move from local experiments to shared execution
    personas:
      economic_sponsors: [CTO, CPO, CIO, Head_of_Engineering]
      terrain_owners: [Engineering_Manager, Platform_Lead, Product_Engineering_Lead]
      veto_players: [CISO, Architecture, Data_or_Security_Governance]
    anti_icp:
      - AI exploration only, with no operational use case
      - Expectation of full autonomy without human control
      - Security model blocks any controlled execution environment
      - No access to required systems or no pilotable team
  market_context:
    epistemic_status: mixed
    evidence_grade: P2
    category_reality_2026:
      - Isolated execution is available in major coding-agent platforms
      - Parallel and asynchronous agent work is increasingly native
      - Skills and custom-agent orchestration are becoming platform primitives
    implication: Sandboxing, multi-agent execution, and skills cannot be treated as sufficient standalone differentiation.
    strategic_risk:
      statement: >
        Vertical compression by coding agents and AI/cloud platforms that
        progressively absorb sandbox, orchestration, memory, policy, and
        execution as native primitives — the horizontal sandbox/orchestration
        layer is the most commoditizable part of the offer.
      epistemic_status: inference
      source: owner_analysis_note (AF-SRC-006)
  value_model:
    epistemic_status: inference
    source: owner_analysis_note (AF-SRC-006)
    framing: >
      Value scales with autonomy x criticality. Low autonomy / low
      criticality is copilot territory; low autonomy / high criticality is
      workflow+HITL; high autonomy / low criticality is a batch/worker agent;
      high autonomy / high criticality — long-running, parallel, real-SI-access,
      high-stakes execution with reduced human per-action supervision — is
      Astraforge's claimed territory.
  moat_assessment:
    epistemic_status: inference
    source: owner_analysis_note (AF-SRC-006)
    weak: [sandbox, agent_orchestration, multi_agent_execution, sdk] # commoditizable, absorbed by model/platform ecosystem
    intermediate: [enterprise_governance, isolation, vpc_deployment, audit, hitl] # harder, but large platforms can also build this
    potentially_strong: >
      A persistent organizational execution memory graph — process, roles,
      policies, permissions, agents, tools, decisions, artifacts, human
      approvals, and execution history accumulated over time — is the asset
      that would be hardest to replicate, if demonstrated at scale (currently
      an ambition stated on the vendor site, not a proven moat).
  differentiation_hypotheses:
    - Enterprise workflow orchestration across internal systems, rules, and human gates
    - Reusable organizational harnesses and artifacts rather than session-local context
    - Governed execution with explicit control points and traceability
    - Flow-level value measurement rather than isolated task productivity
  differentiation_to_validate:
    - Depth of integration versus coding-agent and orchestration platforms
    - Portability across models and agent runtimes
    - Operational governance and audit advantages
    - Reusable workflow assets that materially improve time to value
    - Whether the unified memory graph is a shipped capability or a roadmap ambition
  capabilities:
    - id: AF-CAP-01
      name: Sandbox (isolated execution environment)
      epistemic_status: vendor_claim
      evidence_grade: W2
      source: AF-SRC-005
    - id: AF-CAP-02
      name: Scoped access / RBAC (least-privilege tool and resource access)
      epistemic_status: vendor_claim
      evidence_grade: W2
      source: AF-SRC-005
    - id: AF-CAP-03
      name: Workflow runtime (prompt to durable execution)
      epistemic_status: vendor_claim
      evidence_grade: W2
      source: AF-SRC-005
    - id: AF-CAP-04
      name: Multi-agent execution (specialized, parallel agents)
      epistemic_status: vendor_claim
      evidence_grade: W2
      source: AF-SRC-005
    - id: AF-CAP-05
      name: Policy engine (centralized execution rules)
      epistemic_status: vendor_claim
      evidence_grade: W2
      source: AF-SRC-005
    - id: AF-CAP-06
      name: Approval gates / HITL
      epistemic_status: vendor_claim
      evidence_grade: W2
      source: AF-SRC-005
    - id: AF-CAP-07
      name: Execution preview (pre-action visualization)
      epistemic_status: vendor_claim
      evidence_grade: W2
      source: AF-SRC-005
    - id: AF-CAP-08
      name: Artifacts (materialized intermediate/final results as proof of work)
      epistemic_status: vendor_claim
      evidence_grade: W2
      source: AF-SRC-005
    - id: AF-CAP-09
      name: Audit trail (actions and decisions logged)
      epistemic_status: vendor_claim
      evidence_grade: W2
      source: AF-SRC-005
    - id: AF-CAP-10
      name: Unified memory graph (context, artifacts, decisions across runs)
      epistemic_status: vendor_claim
      evidence_grade: W1
      source: AF-SRC-005
      caveat: The most strategically important claim and the least independently verified — treat as roadmap ambition until demonstrated.
    - id: AF-CAP-11
      name: Connectors (tool and SI integration)
      epistemic_status: vendor_claim
      evidence_grade: W2
      source: AF-SRC-005
    - id: AF-CAP-12
      name: VPC / on-prem / local-model deployment
      epistemic_status: vendor_claim
      evidence_grade: W2
      source: AF-SRC-005
  execution_sequence:
    canonical: [trigger, orchestrate, execute, approve, retain_memory, produce_artifacts]
    epistemic_status: vendor_claim
    source: AF-SRC-005
  use_case_families:
    # UC1-UC2 are horizontal/lower-moat; UC3 (DevFactory) is the demonstrated wedge;
    # UC4-UC6 are land-and-expand targets; UC7 is platform vision, not a sold use case.
    - id: UC1
      name: secure_agent_sandbox
      maturity: horizontal_low_moat
      epistemic_status: mixed
    - id: UC2
      name: long_running_autonomous_workers
      maturity: architecture_demonstrated
      epistemic_status: mixed
    - id: UC3
      name: devfactory_software_engineering
      maturity: demonstrated_wedge
      epistemic_status: vendor_claim
      source: AF-SRC-005
      note: >
        Official demonstrator names Planning Agent, SWE Swarm, Review Agent,
        Deploy Agent, with artifacts (tasks.json, UI components, API routes,
        SQL migration, review.md, release package). Sub-families: feature
        delivery, bug fixing, refactoring/tech debt, migration, runbook
        execution, incident response.
    - id: UC4
      name: devops_production_operations
      maturity: land_and_expand_target
      epistemic_status: inference
      source: owner_analysis_note (AF-SRC-006)
    - id: UC5
      name: datafactory
      maturity: architecture_extension_not_yet_demonstrated
      epistemic_status: vendor_claim
      source: AF-SRC-005
      caveat: Named by the vendor as an architecture extension; public demonstration maturity is not comparable to DevFactory.
    - id: UC6
      name: secfactory
      maturity: architecture_extension_not_yet_demonstrated
      epistemic_status: vendor_claim
      source: AF-SRC-005
      caveat: Same caveat as UC5 — named, not demonstrated at DevFactory's level.
    - id: UC7
      name: business_process_execution
      maturity: platform_vision_not_a_sold_use_case
      epistemic_status: inference
      source: owner_analysis_note (AF-SRC-006)
  hard_gates:
    - id: AF-GATE-01
      test: Measurable workflow problem exists
      severity: blocker
    - id: AF-GATE-02
      test: Terrain owner is identified
      severity: blocker
    - id: AF-GATE-03
      test: Required code, data, and tool access is feasible
      severity: blocker
    - id: AF-GATE-04
      test: Security can approve an isolated controlled execution pattern
      severity: blocker
    - id: AF-GATE-05
      test: Baseline can be measured or reconstructed
      severity: critical
    - id: AF-GATE-06
      test: Pilot can produce a decision within an agreed horizon
      severity: critical
  pilot:
    canonical_name: Roadmap Acceleration Proof
    hypothesis: A controlled agentic workflow can improve a real delivery flow without increasing quality, supervision, or security costs disproportionately.
    primary_metrics: [cycle_time, throughput, accepted_quality, rework]
    guardrail_metrics: [human_supervision_effort, incidents, model_and_infra_cost, escalation_rate]
  delivery:
    recommended_sequence: [qualification, readiness, pilot, scale]
    commercial_model: unknown
    pricing: unknown
  proof:
    source_registry: ../evidence/product/astraforge/source_registry.yaml
    evidence_status: >
      Vendor site now sourced directly (AF-SRC-005) for positioning,
      primitives, and the DevFactory demonstrator; treat as vendor_claim,
      not independently verified fact. Owner strategic analysis (AF-SRC-006)
      adds a value/moat model, kept as inference. External, independent
      commercial proof (customer references, pricing, certifications) is
      still absent.
    evidence_grade: W2
  unknowns:
    - Deployed sandbox technology and isolation mechanism (containers/VMs/other)
    - Security certifications and formal compliance claims
    - Commercial pricing and contracting model
    - Validated external customer references (none independently confirmed)
    - Quantified reference-case baseline and attributable results
    - Whether the unified memory graph is shipped or a stated ambition
    - DataFactory/SecFactory actual maturity versus DevFactory (currently named, not demonstrated)
