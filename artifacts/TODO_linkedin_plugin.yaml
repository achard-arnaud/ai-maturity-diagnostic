version: 0.3-final
updated_at: '2026-08-07'
area: linkedin_plugin
status: deferred
decision: Do not implement an authenticated LinkedIn connector before commercial Gold Set and access/privacy gates. When an approved connector becomes available, use it first and keep public-index research as the non-blocking fallback.
runtime_hierarchy:
  mode: approved_plugin_first_public_fallback
  provider_lane:
    status: deferred_until_gates
    requirement: official approved read-only access only
    purpose:
      - improve freshness and structured role/profile evidence when officially permitted
      - emit external evidence subject to merge and storage policy
    fallback_on:
      - provider unavailable
      - permission denied
      - authentication failure
      - rate limit or transient provider failure
      - insufficient provider coverage
  public_fallback_lane:
    status: allowed_bounded
    runtime: scripts/advanced_research.py --source linkedin
    classification: public_web_discovery_fallback_not_connector
    purpose:
      - discover publicly indexed LinkedIn posts and Pulse articles
      - surface profile-index candidates for role validation
      - maintain useful qualification when no plugin exists or the plugin cannot answer
    prohibitions:
      - authenticated LinkedIn page access
      - cookie extraction or browser automation
      - treating indexed profile text as proof of a current role
      - canonical identity resolution from an indexed result alone
      - LinkedIn write actions
  decision_rule: Public fallback may improve discovery but cannot upgrade connector-grade identity or role-currentness claims. Sensitive person claims still require an approved source or human validation.
  note: The fallback does not satisfy or bypass LI-G0..LI-G6 and does not change connector runtime_status.
