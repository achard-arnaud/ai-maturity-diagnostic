<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engagement — États — GTM V1</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/shell.css">
<link rel="stylesheet" href="../shared/components.css">
</head>
<body>
<div id="gtmShell"></div>

<!-- Literal, inspectable HTML — moved into #gtmMain by shell.js's render().
     See SHELL_CONTRACT.md §1/§3. -->
<template id="gtmMainContent">
  <div class="section-head">
    <div><p class="eyebrow">Engagement</p><h1>Galerie d&rsquo;états</h1>
    <p class="lede">Les 8 états requis par SHELL_CONTRACT.md §3, appliqués à l&rsquo;Inbox.</p></div>
  </div>

  <div class="state-switcher" role="tablist" aria-label="Choisir un état">
    <button type="button" data-target="default" aria-pressed="true">default</button>
    <button type="button" data-target="loading" aria-pressed="false">loading</button>
    <button type="button" data-target="empty" aria-pressed="false">empty</button>
    <button type="button" data-target="error" aria-pressed="false">error</button>
    <button type="button" data-target="blocked" aria-pressed="false">blocked</button>
    <button type="button" data-target="stale" aria-pressed="false">stale</button>
    <button type="button" data-target="partial-data" aria-pressed="false">partial-data</button>
    <button type="button" data-target="success" aria-pressed="false">success</button>
  </div>

  <section class="state-demo-panel" data-state="default">
    <h2>Default</h2>
    <table class="data-table"><thead><tr><th>Personne</th><th>Type</th><th>Compte</th></tr></thead>
    <tbody><tr><td>Marc Ferréol</td><td><span class="badge epi-fact">réponse positive</span></td><td>Acme Corp</td></tr></tbody></table>
  </section>

  <section class="state-demo-panel" data-state="loading" hidden>
    <h2>Loading</h2>
    <div class="state-banner state-banner--loading" role="status">&#x23F3; Chargement de l&rsquo;inbox…</div>
  </section>

  <section class="state-demo-panel" data-state="empty" hidden>
    <h2>Empty</h2>
    <div class="empty-state">Aucune conversation pour ce filtre.</div>
  </section>

  <section class="state-demo-panel" data-state="error" hidden>
    <h2>Error</h2>
    <div class="error-state">Impossible de charger l&rsquo;inbox. <button type="button">Réessayer</button></div>
  </section>

  <section class="state-demo-panel" data-state="blocked" hidden>
    <h2>Blocked</h2>
    <div class="state-banner state-banner--blocked" role="status">&#x26D4; Bloqué — un consentement retiré (unsubscribe) doit être confirmé avant de continuer la séquence. <button type="button" class="state-banner__resolve">Résoudre</button></div>
  </section>

  <section class="state-demo-panel" data-state="stale" hidden>
    <h2>Stale</h2>
    <div class="state-banner state-banner--stale" role="status">&#x21BB; Cette conversation n&rsquo;a pas eu de suivi depuis plus de 14 jours.</div>
  </section>

  <section class="state-demo-panel" data-state="partial-data" hidden>
    <h2>Partial data</h2>
    <div class="state-banner state-banner--partial-data" role="status">&#x25D0; Certains événements d&rsquo;engagement n&rsquo;ont pas pu être synchronisés depuis la messagerie.</div>
    <table class="data-table"><thead><tr><th>Personne</th><th>Type</th></tr></thead>
    <tbody><tr><td>Claire Dubosc</td><td><span class="badge epi-hypothesis">objection (partiel)</span></td></tr></tbody></table>
  </section>

  <section class="state-demo-panel" data-state="success" hidden>
    <h2>Success</h2>
    <table class="data-table"><thead><tr><th>Personne</th><th>Type</th><th>Compte</th></tr></thead>
    <tbody><tr><td>Marc Ferréol</td><td><span class="badge epi-fact">meeting booké</span></td><td>Acme Corp</td></tr></tbody></table>
  </section>
</template>

<script src="../shared/shell.js"></script>
<script>
  GtmProtoShell.render("engagement", {});
  document.querySelectorAll(".state-switcher button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll(".state-switcher button").forEach(function (b) { b.setAttribute("aria-pressed", "false"); });
      btn.setAttribute("aria-pressed", "true");
      document.querySelectorAll(".state-demo-panel").forEach(function (p) {
        p.hidden = p.getAttribute("data-state") !== btn.getAttribute("data-target");
      });
    });
  });
</script>
</body>
</html>
