<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — États — GTM V1</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/shell.css">
<link rel="stylesheet" href="../shared/components.css">
</head>
<body>
<div id="gtmShell"></div>

<template id="gtmMainContent">
  <div class="section-head">
    <div><p class="eyebrow">Admin</p><h1>Galerie d&rsquo;états</h1>
    <p class="lede">Les 8 états requis par SHELL_CONTRACT.md §3, appliqués à la grille de groupes Admin.</p></div>
  </div>

  <div class="state-switcher" role="tablist" aria-label="Choisir un état">
    <button type="button" data-target="default" aria-pressed="true">default</button>
    <button type="button" data-target="loading" aria-pressed="false">loading</button>
    <button type="button" data-target="empty" aria-pressed="false">empty</button>
    <button type="button" data-target="error" aria-pressed="false">error</button>
    <button type="button" data-target="blocked" aria-pressed="false">blocked</button>
    <button type="button" data-target="stale" aria-pressed="false">stale</button>
    <button type="button" data-target="partial-data" aria-pressed="false">partial-data</button>
    <button type="button" data-target="success" aria-pressed="false">success</button>
  </div>

  <section class="state-demo-panel" data-state="default">
    <h2>Default</h2>
    <div class="grid">
      <article class="card"><p class="eyebrow">Users / workspace</p><h3>Workspaces, memberships, users</h3>
        <div class="meta"><span class="badge epi-fact">&#x25CF; existe déjà</span></div></article>
    </div>
  </section>

  <section class="state-demo-panel" data-state="loading" hidden>
    <h2>Loading</h2>
    <div class="state-banner state-banner--loading" role="status">&#x23F3; Chargement des groupes Admin…</div>
  </section>

  <section class="state-demo-panel" data-state="empty" hidden>
    <h2>Empty</h2>
    <div class="empty-state">Aucun groupe Admin visible pour votre rôle.</div>
  </section>

  <section class="state-demo-panel" data-state="error" hidden>
    <h2>Error</h2>
    <div class="error-state">Impossible de charger l&rsquo;état des capacités Admin réelles. <button type="button">Réessayer</button></div>
  </section>

  <section class="state-demo-panel" data-state="blocked" hidden>
    <h2>Blocked</h2>
    <div class="state-banner state-banner--blocked" role="status">&#x26D4; Bloqué — droits admin insuffisants pour ouvrir ce groupe (require_role admin côté produit réel). <button type="button" class="state-banner__resolve">Résoudre</button></div>
  </section>

  <section class="state-demo-panel" data-state="stale" hidden>
    <h2>Stale</h2>
    <div class="state-banner state-banner--stale" role="status">&#x21BB; Le statut "existe déjà / pas encore construit" de ces groupes date de la dernière revue de gap (2026-09-17) et peut avoir changé.</div>
  </section>

  <section class="state-demo-panel" data-state="partial-data" hidden>
    <h2>Partial data</h2>
    <div class="state-banner state-banner--partial-data" role="status">&#x25D0; Audit log indisponible — les autres groupes restent accessibles.</div>
    <div class="grid">
      <article class="card"><p class="eyebrow">Users / workspace</p><h3>Workspaces, memberships, users</h3>
        <div class="meta"><span class="badge epi-fact">&#x25CF; existe déjà</span></div></article>
    </div>
  </section>

  <section class="state-demo-panel" data-state="success" hidden>
    <h2>Success</h2>
    <div class="grid">
      <article class="card"><p class="eyebrow">Users / workspace</p><h3>Workspaces, memberships, users</h3>
        <div class="meta"><span class="badge epi-fact">&#x25CF; à jour</span></div></article>
    </div>
  </section>
</template>

<script src="../shared/shell.js"></script>
<script>
  GtmProtoShell.render("admin", {});
  document.querySelectorAll(".state-switcher button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      document.querySelectorAll(".state-switcher button").forEach(function (b) { b.setAttribute("aria-pressed", "false"); });
      btn.setAttribute("aria-pressed", "true");
      document.querySelectorAll(".state-demo-panel").forEach(function (p) {
        p.hidden = p.getAttribute("data-state") !== btn.getAttribute("data-target");
      });
    });
  });
</script>
</body>
</html>
