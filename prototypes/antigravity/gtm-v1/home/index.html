<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home — GTM V1</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/shell.css">
<link rel="stylesheet" href="../shared/components.css">
<style>
  .my-day-queue { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--gtm-space-2); }
  .my-day-queue li { display: flex; align-items: center; gap: var(--gtm-space-3); padding: var(--gtm-space-2) var(--gtm-space-3); border: 1px solid var(--gtm-border); border-radius: var(--gtm-radius-sm); background: var(--gtm-surface); }
  .my-day-queue .queue-label { flex: 1; }
  .my-day-queue .queue-tag { font-size: 12px; color: var(--gtm-text-muted); text-transform: uppercase; letter-spacing: .03em; min-width: 120px; }
  .nba-row { display: flex; gap: var(--gtm-space-3); flex-wrap: wrap; }
  .nba-row .card { flex: 1 1 220px; }
  button[disabled] { opacity: .55; cursor: not-allowed; }
</style>
</head>
<body>
<div id="gtmShell"></div>
<script src="../shared/shell.js"></script>
<script src="../shared/mock-data.js"></script>
<script>
  GtmProtoShell.render("home", { rail: false });
  var main = document.getElementById("gtmMain");
  var d = window.GtmMockData;

  function companyName(id) {
    var c = d.companies.filter(function (x) { return x.company_id === id; })[0];
    return c ? c.name : id;
  }
  function personName(id) {
    var p = d.people.filter(function (x) { return x.person_id === id; })[0];
    return p ? p.name : id;
  }

  // -- My Day: one aggregated queue across sources, summary + link only.
  var queueItems = [
    { tag: "Fit review", label: "Acme Corp — Fit v2 en attente de revue humaine", href: "../fit/index.html?fit_id=fit_acme_1" },
    { tag: "Reach — approbation", label: "Touchpoint LinkedIn (Claire Dubosc) attend une approbation manuelle", href: "../reach/index.html?touchpoint_id=tpt_2" },
    { tag: "Signal", label: "Signal hiring Acme non revu (12 offres Data/Platform)", href: "../discover/signals.html" },
    { tag: "Research", label: "Research Acme — 1 unknown non résolu (sponsor budgétaire)", href: "../research/index.html?company_id=co_acme" },
    { tag: "Opportunity", label: "Acme — prochaine action : cadrer un pilote avec M. Ferréol", href: "../pipeline/index.html?opportunity_id=opp_acme_1" },
  ]
    .map(function (i) {
      return '<li><span class="queue-tag">' + i.tag + '</span><span class="queue-label">' + i.label + '</span><a href="' + i.href + '">Ouvrir →</a></li>';
    })
    .join("");

  // -- Priority prospects/accounts (research not complete) — same rule as Discover Home.
  var priorityCards = d.companies
    .filter(function (c) { return c.research_status !== "complete"; })
    .map(function (c) {
      return (
        '<article class="card"><p class="eyebrow">' + c.sector + "</p><h3>" + c.name + '</h3>' +
        '<div class="meta"><span class="badge" style="border-color:var(--gtm-border);color:var(--gtm-text-muted);">' + c.research_status.replace("_", " ") + '</span></div>' +
        '<div style="margin-top:8px;"><a href="../discover/index.html">Voir dans Discover →</a></div></article>'
      );
    })
    .join("");

  // -- Signals requiring review (status: new)
  var signalCards = d.signals
    .filter(function (s) { return s.status === "new"; })
    .map(function (s) {
      return (
        '<article class="card"><p class="eyebrow">' + companyName(s.company_id) + '</p><h3>' + s.summary + '</h3>' +
        '<div class="meta"><span class="badge freshness-' + s.freshness + '">&#x27F3; ' + s.freshness + '</span><span class="source-badge">' + s.source + '</span></div>' +
        '<div style="margin-top:8px;"><a href="../discover/signals.html">Revoir dans Discover →</a></div></article>'
      );
    })
    .join("");

  // -- Research blockers (unresolved unknowns)
  var researchCards = d.evidence
    .filter(function (e) { return e.claim_type === "unknown"; })
    .map(function (e) {
      var rc = d.researchCases.filter(function (r) { return r.research_case_id === e.research_case_id; })[0];
      return (
        '<article class="card"><p class="eyebrow">' + (rc ? companyName(rc.company_id) : "—") + '</p><h3>' + e.statement + '</h3>' +
        '<div class="meta"><span class="badge epi-unknown">? Inconnu</span></div>' +
        '<div style="margin-top:8px;"><a href="../research/index.html' + (rc ? "?company_id=" + rc.company_id : "") + '">Ouvrir Research →</a></div></article>'
      );
    })
    .join("");

  // -- Fit reviews (status: pending_review)
  var fitCards = d.fitAssessments
    .filter(function (f) { return f.status === "pending_review"; })
    .map(function (f) {
      return (
        '<article class="card"><p class="eyebrow">' + companyName(f.company_id) + ' · v' + f.version + '</p><h3>' + f.overall_decision + '</h3>' +
        '<div class="meta"><span class="badge epi-hypothesis">&#x25C7; ' + f.status.replace("_", " ") + '</span><span class="version-badge badge">v' + f.version + '</span></div>' +
        '<div style="margin-top:8px;"><a href="../fit/index.html?fit_id=' + f.fit_id + '">Revoir le Fit →</a></div></article>'
      );
    })
    .join("");

  // -- Reach tasks (touchpoints pending_approval or scheduled)
  var reachCards = d.touchpoints
    .filter(function (t) { return t.status === "pending_approval" || t.status === "scheduled"; })
    .map(function (t) {
      var statusBadge = t.status === "pending_approval" ? "epi-hypothesis" : "epi-fact";
      return (
        '<article class="card"><p class="eyebrow">' + personName(t.person_id) + ' · ' + t.channel.replace("_", " ") + '</p><h3>' + t.why_now + '</h3>' +
        '<div class="meta"><span class="badge ' + statusBadge + '">' + t.status.replace("_", " ") + '</span></div>' +
        '<div style="margin-top:8px;"><a href="../reach/index.html?touchpoint_id=' + t.touchpoint_id + '">Ouvrir Reach →</a></div></article>'
      );
    })
    .join("");

  // -- Follow-ups (next_action on opportunities — read-only pointer, no inline edit)
  var followUpCards = d.opportunities
    .map(function (o) {
      return (
        '<article class="card"><p class="eyebrow">' + companyName(o.company_id) + ' · ' + o.stage + '</p><h3>' + o.next_action + '</h3>' +
        '<div class="meta"><span class="human-decision-badge badge">&#x1F464; owner : ' + o.owner + '</span></div>' +
        '<div style="margin-top:8px;"><a href="../pipeline/index.html?opportunity_id=' + o.opportunity_id + '">Ouvrir Pipeline →</a></div></article>'
      );
    })
    .join("");

  // -- Recent engagement (last events, read-only)
  var engagementCards = d.engagementEvents
    .map(function (e) {
      return (
        '<article class="card"><p class="eyebrow">' + personName(e.person_id) + ' · ' + e.occurred_at.slice(0, 10) + '</p><h3>' + e.kind + ' — sentiment ' + e.sentiment + '</h3>' +
        '<div style="margin-top:8px;"><a href="../engagement/index.html?engagement_id=' + e.engagement_id + '">Ouvrir Engagement →</a></div></article>'
      );
    })
    .join("");

  // -- Opportunities at risk — no domain-defined "at risk" rule exists (see DECISION_REQUIRED #1),
  // so risk is shown as an explicit Hypothèse badge, never a computed fact.
  var atRiskCards = d.opportunities
    .map(function (o) {
      return (
        '<article class="card"><p class="eyebrow">' + companyName(o.company_id) + ' · ' + o.value + '</p><h3>' + o.stage + ' — dernier engagement ' + o.last_engagement + '</h3>' +
        '<div class="meta"><span class="badge epi-hypothesis" title="Critère de risque non défini par le domaine — illustratif">&#x25C7; Hypothèse : à risque</span></div>' +
        '<div style="margin-top:8px;"><a href="../pipeline/index.html?opportunity_id=' + o.opportunity_id + '">Ouvrir Pipeline →</a></div></article>'
      );
    })
    .join("");

  // -- Next best actions — CTAs disabled where they'd cross a forbidden interaction line (SHELL_CONTRACT §5)
  var nextBestActions =
    '<article class="card"><h3>Valider l&rsquo;approbation Reach</h3><p style="color:var(--gtm-text-muted);font-size:14px;">Touchpoint LinkedIn en attente.</p>' +
    '<a href="../reach/index.html?touchpoint_id=tpt_2"><button type="button">Ouvrir Reach</button></a></article>' +
    '<article class="card"><h3>Décider le Fit Acme</h3><p style="color:var(--gtm-text-muted);font-size:14px;">Verdict humain requis avant Target.</p>' +
    '<a href="../fit/index.html?fit_id=fit_acme_1"><button type="button">Ouvrir Fit</button></a></article>' +
    '<article class="card"><h3>Créer une Opportunity</h3><p style="color:var(--gtm-text-muted);font-size:14px;">Bloqué : nécessite un Target Plan validé (pas de création sur clic non gouverné).</p>' +
    '<button type="button" disabled title="Bloqué : une Opportunity ne peut pas être créée depuis un clic non gouverné, cf. SHELL_CONTRACT.md §5">Créer (bloqué)</button></article>';

  function section(title, html, emptyLabel) {
    return (
      '<div class="drawer-section"><h4>' + title + '</h4>' +
      (html ? '<div class="grid">' + html + '</div>' : '<div class="empty-state">' + emptyLabel + '</div>') +
      '</div>'
    );
  }

  main.innerHTML =
    '<div class="section-head">' +
    '<div><p class="eyebrow">Home</p><h1>My Day</h1>' +
    '<p class="lede">Ce qui a besoin de vous maintenant — chaque carte ouvre son vrai contexte de travail, rien n&rsquo;est dupliqué ici.</p></div>' +
    '<div><a href="states.html">Voir tous les états →</a></div>' +
    '</div>' +
    '<div class="drawer-section"><h4>My Day — file de travail agrégée</h4>' +
    '<ul class="my-day-queue">' + queueItems + '</ul></div>' +
    section("Priority prospects / accounts", priorityCards, "Aucun compte prioritaire.") +
    section("Signals requiring review", signalCards, "Aucun signal à revoir.") +
    section("Research blockers", researchCards, "Aucun blocage de recherche.") +
    section("Fit reviews", fitCards, "Aucun Fit en attente de revue.") +
    section("Reach tasks", reachCards, "Aucune tâche Reach en attente.") +
    section("Follow-ups", followUpCards, "Aucun follow-up en attente.") +
    section("Recent engagement", engagementCards, "Aucun engagement récent.") +
    section("Opportunities at risk", atRiskCards, "Aucune opportunité à risque.") +
    '<div class="drawer-section"><h4>Next best actions</h4><div class="nba-row">' + nextBestActions + '</div></div>';
</script>
</body>
</html>
