<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline · Opportunities — GTM V1</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/shell.css">
<link rel="stylesheet" href="../shared/components.css">
</head>
<body>
<div id="gtmShell"></div>
<script src="../shared/shell.js"></script>
<script src="../shared/mock-data.js"></script>
<script>
  GtmProtoShell.render("pipeline", {});
  var main = document.getElementById("gtmMain");
  var d = window.GtmMockData;

  function company(id) { return d.companies.filter(function (c) { return c.company_id === id; })[0]; }

  var rows = d.opportunities.map(function (o) {
    var c = company(o.company_id);
    return "<tr><td><a href=\"opportunity.html?opportunity_id=" + o.opportunity_id + "\">" + c.name + "</a></td>" +
      '<td><span class="badge epi-fact">' + o.stage + "</span></td><td>" + o.owner + "</td><td>" + o.value + "</td>" +
      "<td>" + o.next_action + "</td><td>" + o.last_engagement + "</td></tr>";
  }).join("");

  main.innerHTML =
    '<div class="section-head"><div><p class="eyebrow">Pipeline</p><h1>Opportunities</h1>' +
    '<p class="lede">Aucune Opportunity n’est créée depuis cette vue — uniquement consultée.</p></div></div>' +
    '<div class="tabs"><a href="index.html">Leads</a><a href="opportunities.html" aria-current="page">Opportunities</a>' +
    '<a href="deals.html">Deals</a><a href="board.html">Board</a></div>' +
    '<div class="toolbar">' +
    '<button type="button" disabled title="Une Opportunity ne peut être créée que depuis un Fit PURSUE validé + un TargetPlan actif — jamais sur un clic isolé ici.">+ Nouvelle Opportunity</button>' +
    "</div>" +
    '<table class="data-table"><thead><tr><th>Compte</th><th>Stage</th><th>Owner</th><th>Valeur</th><th>Prochaine action</th><th>Dernier engagement</th></tr></thead>' +
    "<tbody>" + rows + "</tbody></table>";
</script>
</body>
</html>
