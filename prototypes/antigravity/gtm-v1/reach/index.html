<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reach — GTM V1</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/shell.css">
<link rel="stylesheet" href="../shared/components.css">
</head>
<body>
<div id="gtmShell"></div>
<script src="../shared/shell.js"></script>
<script src="../shared/mock-data.js"></script>
<script>
  GtmProtoShell.render("reach", { rail: false });
  var main = document.getElementById("gtmMain");
  var d = window.GtmMockData;

  function person(id) { return d.people.filter(function (p) { return p.person_id === id; })[0]; }
  function company(id) { return d.companies.filter(function (c) { return c.company_id === id; })[0]; }
  function sequence(id) { return d.sequences.filter(function (s) { return s.sequence_id === id; })[0]; }
  function targetPlan(id) { return d.targetPlans.filter(function (p) { return p.target_plan_id === id; })[0]; }
  function evidenceById(id) { return d.evidence.filter(function (e) { return e.evidence_id === id; })[0]; }

  // Local, UI-only overlay: fields the mission's Execution Queue needs
  // (evidence binding, approval status label, deadline, retry/pause state)
  // that shared/mock-data.js's Touchpoint doesn't carry. Keyed by
  // touchpoint_id, additive, same Touchpoint shape — no new canonical
  // object. See reach/SCREEN_CONTRACT.md DECISION_REQUIRED #2/#3.
  var touchpointMeta = {
    tpt_1: { evidence_id: "ev_2", retry: "0/3 tentatives", paused: false },
    tpt_2: { evidence_id: "ev_2", retry: "—", paused: false },
  };

  var CHANNEL_LABEL = { email: "Email", linkedin_manual_task: "Tâche manuelle LinkedIn" };
  var STATUS_BADGE = {
    scheduled: '<span class="badge epi-fact">● approuvé</span>',
    pending_approval: '<span class="badge epi-hypothesis">◇ en attente d’approbation</span>',
  };

  var rows = d.touchpoints
    .slice()
    .sort(function (a, b) { return a.scheduled_at.localeCompare(b.scheduled_at); })
    .map(function (tp) {
      var p = person(tp.person_id);
      var seq = sequence(tp.sequence_id);
      var plan = targetPlan(seq.target_plan_id);
      var c = company(plan.company_id);
      var member = plan.members.filter(function (m) { return m.person_id === tp.person_id; })[0];
      var meta = touchpointMeta[tp.touchpoint_id] || { evidence_id: null, retry: "—", paused: false };
      var ev = meta.evidence_id ? evidenceById(meta.evidence_id) : null;
      var time = tp.scheduled_at.split("T")[1].slice(0, 5);
      return (
        "<tr>" +
        "<td>" + time + "</td>" +
        "<td>" + CHANNEL_LABEL[tp.channel] + "</td>" +
        '<td><a href="message-preview.html?touchpoint_id=' + tp.touchpoint_id + '">' + p.name + "</a> · " +
        '<span class="badge human-decision-badge" style="margin-left:2px;">\u{1F464} ' + member.stakeholder_role.replace("_", " ") + "</span></td>" +
        "<td>" + c.name + "</td>" +
        "<td>" + tp.why_now + "</td>" +
        "<td>étape " + tp.step + " / " + seq.name + "</td>" +
        "<td>" + (ev ? '<span class="source-badge">' + ev.source + "</span>" : "—") + "</td>" +
        "<td>" + (STATUS_BADGE[tp.status] || tp.status) + "</td>" +
        "<td>" + tp.scheduled_at.replace("T", " ") + "</td>" +
        "<td>" + meta.retry + (meta.paused ? ' <span class="badge blocker-badge">en pause</span>' : "") + "</td>" +
        "</tr>"
      );
    })
    .join("");

  main.innerHTML =
    '<div class="section-head">' +
    '<div><p class="eyebrow">Reach</p><h1>Execution Queue</h1>' +
    '<p class="lede">Ce qui doit partir aujourd’hui, à qui, pourquoi maintenant — aucun envoi LinkedIn n’est simulé comme automatique.</p></div>' +
    '<div><a href="states.html">Voir tous les états →</a></div>' +
    "</div>" +
    '<div class="tabs" role="tablist" aria-label="Sous-espaces Reach">' +
    '<a href="index.html" aria-current="page">Execution Queue</a>' +
    '<a href="sequences.html">Sequences</a>' +
    '<a href="messages.html">Messages</a>' +
    '<a href="tasks.html">Tasks</a>' +
    '<a href="calls.html">Calls</a>' +
    '<a href="meetings.html">Meetings</a>' +
    '<a href="history.html">Touchpoint history</a>' +
    "</div>" +
    '<table class="data-table"><thead><tr>' +
    "<th>Heure</th><th>Canal</th><th>Target</th><th>Compte</th><th>Why now</th>" +
    "<th>Étape</th><th>Preuve</th><th>Approbation</th><th>Échéance</th><th>Retry/Pause</th>" +
    "</tr></thead><tbody>" + rows + "</tbody></table>";
</script>
</body>
</html>
