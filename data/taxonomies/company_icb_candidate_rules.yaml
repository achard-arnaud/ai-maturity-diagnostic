schema_version: "0.3"
rules_version: "2026-07-23.v0.1"
taxonomy_version: "5.0"
policy:
  output_status: candidate
  evidence_grade: N0
  requires_validation: true
  note: Name patterns create research candidates only. Validate the revenue-generating activity before confirming an ICB classification.
out_of_scope_patterns:
  - '\b(ministere|ministere de|direction generale|ville de|region ile|metropole|cour de cassation|gouvernement|universite|university|opco|af?ev|pole d excellence|chambre|commissaires aux comptes|eu lisa)\b'
sector_rules:
  - rule_id: ICB-R001
    sector_code: "151020"
    rationale: Telecommunications operator or infrastructure name
    patterns: ['\b(orange|bouygues telecom|cellnex|sfr|free mobile|telecom)\b']
  - rule_id: ICB-R002
    sector_code: "101010"
    rationale: Software, IT services, cloud, or digital-platform group
    patterns: ['\b(atos|capgemini|devoteam|sopra|mistral ai|docaposte|dailymotion|deepki|ovh|talend|dassault systemes)\b']
  - rule_id: ICB-R003
    sector_code: "301010"
    rationale: Banking institution or banking business unit
    patterns: ['\b(bnp paribas|societe generale|credit agricole|bpce|banque populaire|caisse d epargne|la banque postale|natixis|boursobank|boursorama|credit mutuel|spuerkeess|odd[o]? bhf|cofidis|arval|bpifrance|banque|bank)\b']
