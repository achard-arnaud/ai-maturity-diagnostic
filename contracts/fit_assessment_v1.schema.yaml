$schema: "https://json-schema.org/draft/2020-12/schema"
schema_version: "1.0"
title: CanonicalFitAssessmentV1
type: object
required:
  - fit_assessment_id
  - workspace_id
  - input_lock
  - status
  - created_at
properties:
  fit_assessment_id: {type: string}
  workspace_id: {type: string}
  input_lock:
    type: object
    required: [demand_id, demand_version, product_snapshot_id, input_hash]
    properties:
      demand_id: {type: string}
      demand_version:
        type: integer
        minimum: 1
        description: >
          Epic 05's Demand optimistic-concurrency version at lock time
          (app.demand_store's internal version counter). Locking to a
          specific version -- not just a demand_id -- is what makes a
          FitAssessment's inputs exact and reproducible even though the
          Demand itself may keep being edited afterward.
      product_snapshot_id: {type: string}
      input_hash:
        type: string
        description: sha256 over (demand_id, demand_version, product_snapshot_id) -- see app.fit_policy.compute_input_lock_hash. Two assessments with the same three inputs always compute the same hash.
    additionalProperties: false
  status:
    enum: [draft, in_review, decided, stale]
  gates:
    type: array
    default: []
    items:
      type: object
      required: [gate_id, name, passed]
      properties:
        gate_id: {type: string}
        name: {type: string}
        passed: {type: boolean}
        reason: {type: [string, "null"], default: null}
      additionalProperties: false
  coverage:
    type: [object, "null"]
    default: null
  gaps:
    type: array
    default: []
    items: {type: string}
  alternatives:
    type: array
    default: []
    items: {type: string}
  counter_evidence:
    type: array
    default: []
    items: {type: string}
  score:
    type: [object, "null"]
    default: null
  verdict:
    type: [object, "null"]
    default: null
  created_at: {type: string, format: date-time}
  updated_at: {type: [string, "null"], format: date-time, default: null}
additionalProperties: false
x-rules:
  - "Hard gates are evaluated before any score exists, and a score can never turn a FAIL or an unresolved critical blocker into a PURSUE verdict (08_EVIDENCE_DECISION_AND_GATES.md's gate order, this Epic's own invariant)."
  - "input_lock is written once, at creation, and never mutated -- a FitAssessment whose locked demand_version or product_snapshot_id is no longer current is stale (see app.fit_policy.is_input_lock_current), not silently re-based onto newer inputs."
  - "No targeting/person field exists here -- Fit precedes targeting (Epic 08), never the reverse."
