$schema: "https://json-schema.org/draft/2020-12/schema"
schema_version: "0.3"
title: PrivateIntegrationAudit
type: object
required:
  - audit_id
  - provider
  - request_id
  - capability
  - action_class
  - occurred_at
  - result_class
  - policy_version
properties:
  audit_id: {type: string}
  provider: {type: string}
  request_id: {type: string}
  auth_subject_ref:
    type: [string, "null"]
  capability: {type: string}
  action_class:
    const: read
  occurred_at:
    type: string
    format: date-time
  result_class:
    enum: [success, denied, unavailable, error, manual_fallback]
  persisted:
    type: boolean
  policy_version: {type: string}
  limitations:
    type: array
    items: {type: string}
additionalProperties: false
x-rules:
  - Audit records stay in the private integration zone.
  - Tokens and raw provider payloads are forbidden.
