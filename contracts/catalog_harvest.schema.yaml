$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://example.invalid/contracts/catalog_harvest.schema.json"
title: Catalog harvest staging contract
type: object
required: [schema_version, harvest_id, created_at, company, shelf_id, items, promotion_contract]
properties:
  schema_version:
    const: "0.5"
  harvest_id:
    type: string
  created_at:
    type: string
  company:
    type: string
    minLength: 1
  shelf_id:
    type: string
    minLength: 1
  source_kind:
    type: string
  items:
    type: array
    minItems: 1
    items:
      type: object
      required: [candidate_id, name, epistemic_status, promotion_status]
      properties:
        candidate_id: {type: string}
        name: {type: string, minLength: 1}
        source_url: {type: [string, "null"]}
        raw_claims: {type: array}
        epistemic_status: {const: unreviewed_source_claim}
        promotion_status: {enum: [candidate, reviewed, rejected, promoted]}
  promotion_contract:
    type: object
    required: [automatic_promotion_to_product_catalog, required_skill, required_human_review]
    properties:
      automatic_promotion_to_product_catalog: {const: false}
      required_skill: {const: product-icp-intelligence}
      required_human_review: {const: true}
additionalProperties: true
