$schema: "https://json-schema.org/draft/2020-12/schema"
schema_version: "1.0"
title: ExternalIdentityMapping
type: object
required:
  - mapping_id
  - provider
  - internal_entity_type
  - internal_entity_id
  - external_subject_ref
  - status
  - observed_at
  - source_evidence_id
properties:
  mapping_id: {type: string}
  provider: {type: string}
  internal_entity_type:
    enum: [person, company, relationship]
  internal_entity_id: {type: string}
  external_subject_ref: {type: string}
  status:
    enum: [candidate, validated, rejected, expired]
  observed_at:
    type: string
    format: date-time
  source_evidence_id: {type: string}
  confidence:
    type: number
    minimum: 0
    maximum: 1
additionalProperties: false
x-rules:
  - External identifiers are aliases and never replace internal IDs.
  - This object is private and must not enter Git with real identifiers.
  - "internal_entity_id references a v1 entity_id (person_v1.schema.yaml / company_v1.schema.yaml / relationship_v1.schema.yaml), not a legacy person_id/company_id/relationship_id. See docs/ADR-009-canonical-identity-model.md."
