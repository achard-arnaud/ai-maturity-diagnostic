$schema: "https://json-schema.org/draft/2020-12/schema"
schema_version: "1.0"
title: CanonicalLeadV1
type: object
required: [lead_id, workspace_id, demand_id, fit_assessment_id, target_plan_id, source_engagement_event_id, status, created_at]
properties:
  lead_id: {type: string}
  workspace_id: {type: string}
  demand_id: {type: string}
  fit_assessment_id: {type: string}
  target_plan_id: {type: string}
  source_engagement_event_id: {type: string}
  status: {enum: [qualified, converted, disqualified]}
  created_at: {type: string, format: date-time}
  updated_at: {type: [string, "null"], format: date-time, default: null}
additionalProperties: false
x-rules:
  - "A Lead is the qualified commercial handoff from Demand, Fit, Targets and Engagement; a raw prospect has no representable shape in this contract."
  - "All referenced records must belong to the same workspace; app.opportunity_policy validates the link chain."
