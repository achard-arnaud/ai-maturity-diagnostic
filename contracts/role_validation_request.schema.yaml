$schema: "https://json-schema.org/draft/2020-12/schema"
schema_version: "0.3"
title: RoleValidationRequest
type: object
required:
  - request_id
  - person_id
  - purpose
  - requested_at
properties:
  request_id:
    type: string
    minLength: 1
  person_id:
    type: string
    minLength: 1
  company_id:
    type: [string, "null"]
  relationship_id:
    type: [string, "null"]
  expected_title:
    type: [string, "null"]
  expected_company_name:
    type: [string, "null"]
  purpose:
    const: current_role_validation
  requested_at:
    type: string
    format: date-time
  reason:
    type: string
additionalProperties: false
x-rules:
  - Internal IDs are canonical and must exist before a connector call.
  - A request does not authorize retrieval, storage, merge, or outreach.
