[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-qualification"
version = "0.3.0"
description = "Evidence-based enterprise AI qualification, product fit, and private-network orchestration"
requires-python = ">=3.11,<4"
dependencies = [
  "PyYAML>=6.0,<7",
  "jsonschema>=4.20,<5",
]

[project.optional-dependencies]
docs = [
  "python-docx>=1.2,<2",
  "Pillow>=10,<13",
]
dev = [
  "coverage>=7,<8",
  "pytest>=8,<10",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["scripts"]
omit = ["tests/*"]
