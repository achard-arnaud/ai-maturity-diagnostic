[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-qualification"
version = "0.3.0"
description = "Evidence-based enterprise AI qualification, product fit, and private-network orchestration"
requires-python = ">=3.11,<4"
dependencies = [
  "PyYAML>=6.0,<7",
  "jsonschema>=4.20,<5",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "authlib>=1.3,<2",
  "itsdangerous>=2.2,<3",
  "python-multipart>=0.0.9,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
]

[project.optional-dependencies]
docs = [
  "python-docx>=1.2,<2",
  "Pillow>=10,<13",
]
dev = [
  "coverage>=7,<8",
  "pytest>=8,<10",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
